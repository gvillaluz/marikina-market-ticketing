# The "Deploy website" button: GitHub → Actions → Deploy website → Run workflow.
# Builds the website from main with the demo server's address and uploads it to the Static Web App.
# It only runs when pressed, so the server can be updated first (deployment-guide.md, step 4).
name: Deploy website
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm ci
        working-directory: marikina-market-web
      - run: npm run build
        working-directory: marikina-market-web
        env:
          VITE_API_BASE_URL: https://marikina-market-server.azurewebsites.net
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: marikina-market-web/dist
          skip_app_build: true
          skip_api_build: true
